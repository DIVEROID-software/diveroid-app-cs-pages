<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Privacy Policy — DIVEROID</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
  </head>
  <body>
    <!-- App Bar -->
    <div class="page-header">
      <button class="btn-close" type="button" onclick="closePage()" aria-label="Close">
        <img src="../assets/icons/ic_l_close_24.svg" alt="" width="24" height="24" />
      </button>
      <h1 id="page-title">Privacy Policy</h1>
    </div>

    <div class="content-wrapper" id="content-root"></div>

    <script src="../assets/js/bridge.js"></script>
    <script src="../assets/i18n/privacy-policy.js"></script>
    <script>
      function render(lang) {
        var data = window.PAGE_CONTENT[lang];
        if (!data) return;

        var html = "";
        data.sections.forEach(function (sec, i) {
          html += '<div class="section">';
          html += "<h2>" + sec.heading + "</h2>";
          html += sec.body;
          html += "</div>";
          if (i < data.sections.length - 1) {
            html += '<div class="section-divider"></div>';
          }
        });
        html +=
          '<div class="contact-cta">' +
          "<p>" +
          data.cta.text +
          "</p>" +
          '<button class="btn-contact" onclick="openInquiry()">' +
          data.cta.button +
          "</button>" +
          "</div>";

        document.getElementById("content-root").innerHTML = html;
        document.getElementById("page-title").textContent = data.pageTitle;
      }

      var currentLang = "en";

      function setLang(lang) {
        currentLang = lang;
        render(lang);
        window.ReactNativeWebView &&
          window.ReactNativeWebView.postMessage(
            JSON.stringify({ type: "langChanged", lang: lang }),
          );
      }

      onBridgeMessage("setLang", setLang);

      // Init
      setLang(initLang());
    </script>
  </body>
</html>
